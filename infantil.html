<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi viaje por el sistema solar</title>
<style>
:root{font-family:system-ui;background:#07121e;color:#f4f8ff}
*{box-sizing:border-box}
body{margin:0}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:14px max(16px,4%);border-bottom:1px solid #345}
header a{color:#b9f1d4;white-space:nowrap}
main{max-width:1000px;margin:auto;padding:16px}
.box{background:#112437;border:1px solid #345;border-radius:18px;padding:18px}
button{font:inherit;cursor:pointer;border:1px solid #456;background:#193248;color:white;border-radius:12px;padding:10px}
button:disabled{opacity:.45;cursor:not-allowed}
canvas{display:block;width:100%;height:clamp(300px,45vw,480px);background:#050d19;border-radius:14px}
.mission{padding-top:16px}
h1{font-size:clamp(25px,4vw,36px);margin:.35em 0}
p{color:#c9dce9;line-height:1.55}
.fact{background:#1a3a4b;border-left:4px solid #b9f1d4;padding:14px;border-radius:10px;margin-top:16px}
.fact p{margin-bottom:0}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}
.controls button,.mission-nav button{background:#b9f1d4;color:#123127;font-weight:bold;white-space:nowrap}
.controls input{accent-color:#b9f1d4;width:220px;max-width:100%;vertical-align:middle}
.mission-nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.mission-nav button{flex:0 1 auto;padding:10px 12px;font-size:clamp(12px,3.5vw,16px)}
.steps-box{margin-top:16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.step{text-align:left}
.active{background:#275c50;border-color:#aee9d1}
.small{font-size:12px;color:#9fbaca}
@media(max-width:480px){header{font-size:14px}.box{padding:12px}.controls{gap:8px}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.step{font-size:12px}}
</style>
<header><strong>☀️ Mi viaje por el sistema solar</strong><a href="./">Explorador original</a></header>
<main>
  <section class="box" aria-label="Misión del sistema solar">
    <canvas id="space" role="img" aria-label="Animación del sistema solar"></canvas>
    <div class="mission">
      <div id="stage" class="small"></div>
      <h1 id="title"></h1>
      <p id="explain"></p>
      <div class="fact"><b>✨ Anécdota curiosa</b><p id="fact"></p></div>
    </div>
    <div class="mission-nav"><button id="prev">← Anterior</button><button id="next">Siguiente misión →</button></div>
    <div class="controls"><button id="play">⏸ Pausar</button><label>Velocidad <b id="speedLabel">1×</b> <input id="speed" type="range" min="0" max="5" value="2"></label><button id="reset">↺ Reiniciar</button></div>
    <p class="small" id="note"></p>
  </section>
  <aside class="box steps-box"><h2>🚀 10 misiones</h2><p class="small">Toca una misión para explorar.</p><nav class="steps" id="steps" aria-label="Elegir misión"></nav></aside>
</main>
<script>
const lessons=[["¡Hola, Sol!","Mira cómo la Tierra viaja alrededor del Sol.","La luz del Sol tarda unos 8 minutos en llegar a nosotros."],["¡Llegan los planetas!","Ahora aparecen los ocho planetas. Fíjate en su orden.","También existen lunas, asteroides y planetas enanos."],["¡Acelera el tiempo!","Mueve la barra: ¡puedes hacer que los planetas corran o se detengan!","Mercurio tarda 88 días en dar una vuelta al Sol."],["No todos van igual","Los planetas cercanos suelen completar sus vueltas antes.","Neptuno tarda unos 165 años terrestres en dar una vuelta."],["¡Las órbitas son elipses!","Las órbitas no son círculos perfectos: son un poquito alargadas.","La órbita de Venus es casi circular y la de Mercurio es más alargada."],["¡Más rápido cerca del Sol!","Observa cómo un planeta acelera cuando está más cerca del Sol.","Es una de las leyes de Kepler."],["No todo está plano","Las órbitas tienen pequeñas inclinaciones. Aquí las mostramos desde una perspectiva sencilla.","Mercurio tiene una órbita más inclinada que la Tierra."],["¡La Luna nos acompaña!","La Luna gira alrededor de la Tierra mientras ambas viajan alrededor del Sol.","La Luna tarda unos 27 días en dar una vuelta a la Tierra."],["¡El Sol también se mueve!","Los planetas tiran del Sol con su gravedad y hacen que se bambolee.","Júpiter influye mucho en ese movimiento."],["¡Viajamos por la galaxia!","Todo el sistema solar viaja junto por la Vía Láctea.","El Sol tarda unos 230 millones de años en rodear el centro galáctico."]];const names=["Mercurio","Venus","Tierra","Marte","Júpiter","Saturno","Urano","Neptuno"],colors=["#bbb0a6","#d8ba8a","#63bce9","#df8065","#d6ae89","#e5cf9e","#a2dad8","#709dd0"],period=[88,225,365,687,4333,10759,30687,60190],ecc=[.206,.007,.017,.093,.049,.057,.046,.009];let level=0,paused=false,clock=0,last=0;const $=id=>document.getElementById(id),canvas=$("space"),ctx=canvas.getContext("2d");function show(){$("steps").innerHTML="";lessons.forEach((l,i)=>{let b=document.createElement("button");b.className="step"+(i===level?" active":"");b.textContent=(i+1)+". "+l[0];b.onclick=()=>{level=i;show()};$("steps").append(b)});$("stage").textContent="MISIÓN "+(level+1)+" DE 10";$("title").textContent=lessons[level][0];$("explain").textContent=lessons[level][1];$("fact").textContent=lessons[level][2];$("prev").disabled=level===0;$("next").textContent=level===9?"Volver al inicio ↺":"Siguiente misión →";$("note").textContent=level>=8?"Movimiento del Sol y viaje galáctico exagerados para aprender; no son trayectorias exactas.":"Los tamaños y las distancias se han adaptado para ver los planetas."} $("prev").onclick=()=>{level=Math.max(0,level-1);show()};$("next").onclick=()=>{level=(level+1)%10;show()};$("play").onclick=()=>{paused=!paused;$("play").textContent=paused?"▶ Continuar":"⏸ Pausar"};$("reset").onclick=()=>clock=0;$("speed").oninput=()=>{$("speedLabel").textContent=["0×","0,25×","1×","3×","10×","30×"][+$("speed").value]};function draw(ms){let dt=Math.min(.05,(ms-last)/1000||0);last=ms;let speed=[0,.25,1,3,10,30][+$("speed").value];if(!paused&&!document.hidden)clock+=dt*speed;let w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=w*dpr;canvas.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const max=Math.min(w*.43,h*.43),cx=w*.49,cy=h*.5;for(let i=0;i<65;i++){ctx.fillStyle="#7d98b3";ctx.fillRect((i*113.17%1000)/1000*w,(i*271.13%1000)/1000*h,1.2,1.2)}let gal=level===9?Math.sin(clock*.12)*Math.min(w*.15,75):0,wobble=level>=8?Math.sin(clock*.8)*Math.min(max*.12,15):0;ctx.fillStyle="#ffca58";ctx.shadowColor="#ffb443";ctx.shadowBlur=23;ctx.beginPath();ctx.arc(cx+gal+wobble,cy,Math.max(10,max*.07),0,7);ctx.fill();ctx.shadowBlur=0;for(let i=0;i<8;i++){if(level===0&&i!==2)continue;let r=max*(.18+i*.105),e=level>=4?ecc[i]:0,tilt=level>=6?.78+(i%3)*.07:1;ctx.strokeStyle="#344c60";ctx.beginPath();ctx.ellipse(cx+gal+wobble-r*e,cy,r,r*Math.sqrt(1-e*e)*tilt,0,0,7);ctx.stroke();let M=clock*3.4*365/period[i]+i*.72,E=M;if(level>=5)for(let j=0;j<6;j++)E=M+e*Math.sin(E);let x=cx+gal+wobble+r*(Math.cos(E)-e),y=cy+r*Math.sqrt(1-e*e)*tilt*Math.sin(E);ctx.fillStyle=colors[i];ctx.beginPath();ctx.arc(x,y,i===2?5.5:4,0,7);ctx.fill();if(level===7&&i===2){ctx.fillStyle="#e4e6e8";ctx.beginPath();ctx.arc(x+Math.cos(clock*2)*13,y+Math.sin(clock*2)*13,3,0,7);ctx.fill()}}if(level===9){ctx.strokeStyle="#80b4ce";ctx.setLineDash([7,9]);ctx.beginPath();ctx.moveTo(cx-w*.3,cy+h*.35);ctx.lineTo(cx+w*.3,cy-h*.35);ctx.stroke();ctx.setLineDash([])}requestAnimationFrame(draw)}show();$("speed").dispatchEvent(new Event("input"));requestAnimationFrame(draw);
</script></html>
