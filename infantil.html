<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi viaje por el sistema solar</title>
<style>
:root{font-family:system-ui;background:#07121e;color:#f4f8ff}
*{box-sizing:border-box}
body{margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px max(12px,3%);border-bottom:1px solid #345}
header a{color:#b9f1d4;white-space:nowrap}
main{max-width:1000px;margin:auto;padding:10px}
.box{background:#112437;border:1px solid #345;border-radius:18px;padding:12px}
button{font:inherit;cursor:pointer;border:1px solid #456;background:#193248;color:white;border-radius:10px;padding:8px}
button:disabled{opacity:.45;cursor:not-allowed}
.animation{position:relative}
canvas{display:block;width:100%;height:clamp(210px,34vh,420px);background:#050d19;border-radius:14px}
#play{position:absolute;top:8px;right:8px;background:#b9f1d4;color:#123127;font-weight:bold;min-width:38px;min-height:38px}
.mission{padding-top:9px}
h1{font-size:clamp(23px,4vw,34px);line-height:1.1;margin:3px 0 6px}
p{color:#c9dce9;line-height:1.35;margin:0}
.fact{background:#1a3a4b;border-left:4px solid #b9f1d4;padding:10px;border-radius:10px;margin-top:10px}
.mission-nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.mission-nav button{background:#b9f1d4;color:#123127;font-weight:bold;white-space:nowrap;padding:8px 10px;font-size:clamp(12px,3.5vw,16px)}
.steps{display:flex;justify-content:center;gap:8px;margin-top:10px}
.step{min-width:38px;min-height:38px;padding:6px;text-align:center}
.active{background:#275c50;border-color:#aee9d1}
.small{font-size:12px;color:#9fbaca}
@media(max-width:480px){header{font-size:14px}.box{padding:10px}.mission-nav button{padding:8px}.step{font-size:13px}}
</style>
<header><strong>☀️ Sistema solar</strong><a href="./">Explorador original</a></header>
<main>
  <section class="box" aria-label="Misión del sistema solar">
    <div class="animation"><canvas id="space" role="img" aria-label="Animación del sistema solar"></canvas><button id="play" type="button" aria-label="Pausar animación" title="Pausar animación">⏸</button></div>
    <div class="mission">
      <div id="stage" class="small"></div>
      <h1 id="title"></h1>
      <p id="explain"></p>
      <div class="fact"><p id="fact"></p></div>
    </div>
    <div class="mission-nav"><button id="prev">← Anterior</button><button id="next">Siguiente misión →</button></div>
  </section>
  <nav class="steps" id="steps" aria-label="Elegir misión"></nav>
</main>
<script>
const lessons = [
  ["¡Hola, Sol!", "La Tierra gira alrededor del Sol.", "La luz solar tarda unos 8 minutos en llegar a la Tierra."],
  ["Los ocho planetas", "Todos orbitan el Sol; los cercanos completan antes sus vueltas.", "Mercurio tarda 88 días en dar una vuelta; Neptuno, unos 165 años."],
  ["Órbitas elípticas", "Las órbitas son elipses: los planetas aceleran al acercarse al Sol.", "La órbita de Venus es casi circular; la de Mercurio, más alargada."],
  ["La Tierra y la Luna", "La Luna gira alrededor de la Tierra mientras ambas rodean el Sol.", "La Luna tarda unos 27 días en dar una vuelta a la Tierra."],
  ["Viaje por la galaxia", "El Sol se bambolea y todo el sistema solar recorre la Vía Láctea.", "El Sol tarda unos 230 millones de años en rodear el centro galáctico."]
];
const scenes=[0,2,5,7,9];
const colors=["#bbb0a6","#d8ba8a","#63bce9","#df8065","#d6ae89","#e5cf9e","#a2dad8","#709dd0"];
const period=[88,225,365,687,4333,10759,30687,60190],ecc=[.206,.007,.017,.093,.049,.057,.046,.009];
let level=0,paused=false,clock=0,last=0;
const $=id=>document.getElementById(id),canvas=$("space"),ctx=canvas.getContext("2d");
function show(){
  $("steps").replaceChildren();
  lessons.forEach((lesson,i)=>{
    const button=document.createElement("button");
    button.className="step"+(i===level?" active":"");
    button.textContent=i+1;
    button.setAttribute("aria-label",`Misión ${i+1}: ${lesson[0]}`);
    if(i===level)button.setAttribute("aria-current","step");
    button.onclick=()=>{level=i;show()};
    $("steps").append(button);
  });
  $("stage").textContent=`MISIÓN ${level+1} DE 5`;
  $("title").textContent=lessons[level][0];
  $("explain").textContent=lessons[level][1];
  $("fact").textContent=lessons[level][2];
  $("prev").disabled=level===0;
  $("next").textContent=level===4?"Volver al inicio ↺":"Siguiente misión →";
}
$("prev").onclick=()=>{level=Math.max(0,level-1);show()};
$("next").onclick=()=>{level=(level+1)%5;show()};
$("play").onclick=()=>{
  paused=!paused;
  $("play").textContent=paused?"▶":"⏸";
  $("play").setAttribute("aria-label",paused?"Continuar animación":"Pausar animación");
  $("play").title=paused?"Continuar animación":"Pausar animación";
};
function draw(ms){let dt=Math.min(.05,(ms-last)/1000||0);last=ms;if(!paused&&!document.hidden)clock+=dt;let scene=scenes[level];let w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=w*dpr;canvas.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const max=Math.min(w*.43,h*.43),cx=w*.49,cy=h*.5;for(let i=0;i<65;i++){ctx.fillStyle="#7d98b3";ctx.fillRect((i*113.17%1000)/1000*w,(i*271.13%1000)/1000*h,1.2,1.2)}let gal=scene===9?Math.sin(clock*.12)*Math.min(w*.15,75):0,wobble=scene>=8?Math.sin(clock*.8)*Math.min(max*.12,15):0;ctx.fillStyle="#ffca58";ctx.shadowColor="#ffb443";ctx.shadowBlur=23;ctx.beginPath();ctx.arc(cx+gal+wobble,cy,Math.max(10,max*.07),0,7);ctx.fill();ctx.shadowBlur=0;for(let i=0;i<8;i++){if(scene===0&&i!==2)continue;let r=max*(.18+i*.105),e=scene>=4?ecc[i]:0,tilt=scene>=6?.78+(i%3)*.07:1;ctx.strokeStyle="#344c60";ctx.beginPath();ctx.ellipse(cx+gal+wobble-r*e,cy,r,r*Math.sqrt(1-e*e)*tilt,0,0,7);ctx.stroke();let M=clock*3.4*365/period[i]+i*.72,E=M;if(scene>=5)for(let j=0;j<6;j++)E=M+e*Math.sin(E);let x=cx+gal+wobble+r*(Math.cos(E)-e),y=cy+r*Math.sqrt(1-e*e)*tilt*Math.sin(E);ctx.fillStyle=colors[i];ctx.beginPath();ctx.arc(x,y,i===2?5.5:4,0,7);ctx.fill();if(scene===7&&i===2){ctx.fillStyle="#e4e6e8";ctx.beginPath();ctx.arc(x+Math.cos(clock*2)*13,y+Math.sin(clock*2)*13,3,0,7);ctx.fill()}}if(scene===9){ctx.strokeStyle="#80b4ce";ctx.setLineDash([7,9]);ctx.beginPath();ctx.moveTo(cx-w*.3,cy+h*.35);ctx.lineTo(cx+w*.3,cy-h*.35);ctx.stroke();ctx.setLineDash([])}requestAnimationFrame(draw)}
show();requestAnimationFrame(draw);
</script></html>
